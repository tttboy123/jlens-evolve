schema_version: 1
task_id: transaction-record-cleaning-v1
task_family: record-cleaning
tags: [normalization, filtering, aggregation, validation, sorting]
state_dir: state
behavior_equivalent_limit: 2
lesson_min_evidence: 2
experience_limit: 3
resume: auto

# Bounded meta-policy candidates are persisted and compared between runs.  They
# are not promoted unless their post-revision accepted-improvement yield rises.
meta_policy:
  enabled: true
  stagnation_window: 10
  candidates:
    - id: focused-v1
      temperature: 0.85
      num_top_programs: 1
      num_diverse_programs: 0
    - id: exploratory-v1
      temperature: 0.95
      num_top_programs: 1
      num_diverse_programs: 1
    - id: exploratory-v2
      temperature: 0.95
      num_top_programs: 1
      num_diverse_programs: 1
      stochastic_llm: true
    - id: jlens-guided-v1
      temperature: 0.95
      num_top_programs: 1
      num_diverse_programs: 1
      stochastic_llm: true
      agent_strategy_file: analysis/agent-baseline/agent_strategy.json
