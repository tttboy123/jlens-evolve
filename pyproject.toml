[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-evolve"
version = "3.0.0.dev0"
description = "Evidence-centric evolution platform for frozen Agent programs"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
]

[project.scripts]
evolve-v3 = "evolve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
